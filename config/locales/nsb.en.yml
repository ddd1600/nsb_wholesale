en:
  spree:
    # Solidus labels every checkout step's button "Save and Continue", which on
    # the payment step reads as "save my card details" -- alarming, and untrue:
    # Square tokens are single-use and no card is ever stored. Relabelled rather
    # than adding a "don't save my card" opt-out, which would imply we save cards.
    save_and_continue: "Continue"
  nsb:
    checkout:
      card_not_stored: "Your card details go straight to Square and are never stored on our servers. You'll enter them again next time you order."
    claims:
      title: "Set up your wholesale account"
      intro: "Your account and order history have already been moved over. Enter the email address you used to order from us and we'll send you a link to choose a password."
      email_label: "Email address"
      submit: "Send me a setup link"
      blank_email: "Please enter your email address."
      # Deliberately tells the visitor the address is unknown, so a typo or a
      # forgotten alternate address can be corrected immediately.
      not_found: "We don't have %{email} on file. It may be a typo, or your account may be under a different email address — often the one your business first ordered with. Try another address, or get in touch and we'll look it up for you."
      rate_limited: "That's a lot of attempts in a short time. Please wait a few minutes and try again, or contact us and we'll help."
      help_html: "Stuck? Email us at %{email} and we'll sort it out."
      sent:
        title: "Check your email"
        body: "If %{email} is the address we have on file, a setup link is on its way. It's valid for %{days} days."
        spam_hint: "It should arrive within a few minutes. If you don't see it, check your spam or junk folder."
        retry: "Entered the wrong address?"
        retry_link: "Try a different email"
      claiming_for: "Setting up the portal for %{company}."
    pricing:
      # Shown wherever a price would be, to a visitor who is not signed in. The
      # catalog is public so a prospect can see what we sell; the wholesale sheet
      # is not.
      sign_in_for_pricing: "Sign in to see wholesale pricing"
      sign_in_to_order: "Sign in to see pricing and place an order."
      sign_in: "Sign in"
      apply: "apply for an account"
      no_account_html: "Not a wholesale customer yet? You can %{apply}."
    welcome:
      title: "Wholesale ordering for New South Botanicals"
      intro: "This portal is for approved wholesale customers. Sign in to see pricing and place orders."
      existing_heading: "Already a New South Botanicals wholesale customer?"
      existing_body: "Your account and order history have already been moved over. Enter your email address and we'll send you a link to choose a password."
      existing_cta: "Set up my account"
      new_heading: "New to New South Botanicals?"
      new_body: "Tell us about your business and we'll review your application for a wholesale account."
      new_cta: "Apply for an account"
      signed_in_already: "Already have a password?"
      sign_in: "Sign in"
      browse: "Browse the catalog"
    applications:
      title: "Apply for a wholesale account"
      intro: "Wholesale is for licensed retailers. Tell us about your business and we'll be in touch once we've reviewed your application."
      submit: "Submit application"
      required_note: "Required field"
      select_state: "Select a state"
      address_check:
        heading: "Please check the address you entered"
        did_you_mean: "Did you mean: %{address}"
        confirm_checkbox: "I've checked it — this address is correct. Submit it as I entered it."
      # The 360 accounts migrated from the old portal make this likely enough to
      # be worth handling rather than creating a duplicate.
      already_a_customer_html: "It looks like %{email} already has an account with us. %{claim} instead."
      already_a_customer_link: "Set up your existing account"
      duplicate_pending: "We've already got an application from %{email} and are reviewing it. We'll be in touch."
      received:
        title: "Application received"
        body: "Thanks — we've got your application and will review it shortly. If approved, you'll get an email with a link to set your password."
      fields:
        business_name: "Business name"
        contact_name: "Your name"
        email: "Email address"
        phone: "Phone number"
        address: "Business address"
        shipping_address: "Shipping address (if different from business address)"
        retail_license_state: "Retail license state"
        retail_license_number: "Retail license number"
        sells: "What does your business sell?"
        interested_in: "What are you interested in?"
        heard_about_us: "How did you hear about us?"
